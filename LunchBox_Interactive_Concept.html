<div class="app"><aside class="sidebar"><div class="brand"><span class="brandmark" aria-hidden="true"></span>LunchBox</div><div><div class="eyebrow" style="margin:0 0 12px 14px">Your kitchen</div><nav class="nav" aria-label="Main navigation" id="nav"></nav></div><div class="sidebar-note"><div class="eyebrow" style="color:var(--ink);margin-bottom:10px">Our kind of meal prep</div><strong>Less guessing.<br>More good meals.</strong><p>Start with what you have.<br>Leave room for real life.</p></div><button class="reset" onclick="resetDemo()">Reset sample household</button></aside><main class="main"><header class="topbar"><div class="topbar-left">The everyday kitchen</div><div class="topbar-right"><span>2 people · Metric</span><span class="avatar" aria-hidden="true">LB</span><button class="reset" onclick="about()">About this demo</button></div></header><section id="content" class="content" aria-label="Application view"></section></main></div>

<script>
'use strict';
const ICONS={plan:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M14 14h2M8 18h2"/>',recipes:'<path d="M7 3v6M4 3v5c0 3 6 3 6 0V3M7 10v11M17 3c-4 5-3 10 1 10V3M18 13v8"/>',pantry:'<path d="M5 7h14v14H5zM7 3h10v4M5 12h14M9 16h6"/>',grocery:'<path d="M3 4h2l3 12h11l2-9H6M9 21h.01M18 21h.01"/>'};
const svg=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
const INITIAL={inventory:[{id:'tomatoes',name:'Roma tomatoes',qty:800,unit:'g',location:'Fridge',source:'Garden',soon:true},{id:'lentils',name:'Lentils (sealed pouch)',qty:500,unit:'g',location:'Cupboard',source:'Grocery',soon:false},{id:'rice',name:'Jasmine rice',qty:1000,unit:'g',location:'Cupboard',source:'Grocery',soon:false},{id:'onion',name:'Yellow onion',qty:2,unit:'each',location:'Cupboard',source:'Grocery',soon:false},{id:'oil',name:'Olive oil',qty:250,unit:'ml',location:'Cupboard',source:'Grocery',soon:false},{id:'zucchini',name:'Zucchini',qty:2,unit:'each',location:'Fridge',source:'Farm share',soon:true},{id:'pepper',name:'Sweet peppers',qty:2,unit:'each',location:'Fridge',source:'Garden',soon:true},{id:'beans',name:'Canned white beans',qty:400,unit:'g',location:'Cupboard',source:'Grocery',soon:false},{id:'spinach',name:'Spinach',qty:0,unit:'g',location:'Fridge',source:'Grocery',soon:false},{id:'lemon',name:'Lemon',qty:0,unit:'each',location:'Fridge',source:'Grocery',soon:false}],plans:[],requests:[],manual:[],picked:{},saved:['r3'],leftovers:[],events:[]};
const RECIPES=[{id:'r1',name:'Tomato & lentil skillet',subtitle:'A warm, easy dinner built around your tomatoes.',time:25,servings:2,tool:'1 pan',soon:['tomatoes'],ingredients:[['tomatoes',400],['lentils',250],['rice',150],['onion',1],['oil',15],['spinach',100]],why:[['Use your tomatoes first','Prioritizes an ingredient you marked “use soon.”'],['Works with your kitchen','A skillet and a lid. No special equipment.'],['A small grocery gap','One missing ingredient; no full-list shopping trip.']],steps:['Soften the chopped onion in the oil in a deep, lidded skillet.','Add chopped tomatoes, rice and water as needed for your rice. Cover and simmer, checking the rice until cooked.','Stir in the cooked lentils and spinach. Heat through, season to taste and divide into two portions.']},{id:'r2',name:'Garden rice bowls',subtitle:'A colorful way to use your garden vegetables.',time:30,servings:2,tool:'Oven + pot',soon:['zucchini','pepper'],ingredients:[['zucchini',1],['pepper',1],['rice',150],['oil',15],['beans',200],['lemon',1]],why:[['Garden-first cooking','Makes room for zucchini and sweet peppers.'],['Room for a little prep','Two cooking vessels; a practical batch-cooking option.'],['One bright extra','A lemon is the only ingredient not on hand.']],steps:['Cook rice according to its package instructions.','Cut the zucchini and pepper; toss with the oil and roast until tender.','Warm the drained beans, assemble with the rice and vegetables, and finish with lemon.']},{id:'r3',name:'Pantry lentil rice',subtitle:'A simple fallback for the nights you want less effort.',time:25,servings:2,tool:'1 pot',soon:[],ingredients:[['lentils',250],['rice',150],['onion',1],['oil',15]],why:[['No extra shopping','Uses only the ingredients in this sample pantry.'],['A low-effort fallback','One pot, a lid and four pantry ingredients.'],['You saved this one','Familiar meals are part of a useful recommendation engine.']],steps:['Soften the chopped onion in the oil.','Add rice and water according to package instructions. Cover and cook until the rice is tender.','Fold in the cooked lentils, heat through and season to taste.']}];
let state;try{state=JSON.parse(localStorage.getItem('lunchbox-concept-v1'))||structuredClone(INITIAL)}catch(e){state=structuredClone(INITIAL)}
let view='recipes',selected='r1',recipeTab='cook',pantryTab='all',goal='use-soon',lastUndo=null,lastFocus=null,toastTimer=null;

const item=id=>state.inventory.find(i=>i.id===id);const recipe=id=>RECIPES.find(r=>r.id===id);const fmt=(n,u)=>`${Number(n.toFixed(1)).toLocaleString()}${u==='each'?'':` ${u}`}`;
function persist(){try{localStorage.setItem('lunchbox-concept-v1',JSON.stringify(state))}catch(e){}}
function change(message,fn){lastUndo=structuredClone(state);fn();state.events.unshift(message);state.events=state.events.slice(0,8);persist();render();toast(message,true)}
function undo(){if(!lastUndo)return;state=lastUndo;lastUndo=null;persist();render();toast('Last change undone. All linked views are restored.');}
function demand(){const d={};function add(r,scale,reason){r.ingredients.forEach(([id,n])=>{if(!d[id])d[id]={qty:0,reasons:[]};d[id].qty+=n*scale;if(!d[id].reasons.includes(reason))d[id].reasons.push(reason)})}state.plans.filter(p=>!p.cooked).forEach(p=>add(recipe(p.recipeId),p.servings/2,`${p.day} · ${recipe(p.recipeId).name}`));state.requests.filter(rid=>!state.plans.some(p=>p.recipeId===rid&&!p.cooked)).forEach(rid=>add(recipe(rid),1,`Cook next · ${recipe(rid).name}`));return d;}
function shopping(){const d=demand(),rows={};Object.entries(d).forEach(([id,v])=>{const need=Math.max(0,v.qty-item(id).qty);if(need>0)rows[id]={...item(id),need,reasons:v.reasons}});state.manual.forEach(m=>{if(rows[m.id]){rows[m.id].need+=m.qty;rows[m.id].reasons.push('Added by you')}else rows[m.id]={...item(m.id),need:m.qty,reasons:['Added by you']}});Object.entries(state.picked).forEach(([id,p])=>{if(!rows[id])rows[id]={...item(id),need:p.qty,reasons:['Picked up · waiting to be put away']};rows[id].picked=true});return Object.values(rows);}
function missing(r,servings=2){return r.ingredients.filter(([id,n])=>item(id).qty<n*servings/2)}
function nav(v){view=v;render();window.scrollTo(0,0)}
function render(){const cart=shopping().length;document.getElementById('nav').innerHTML=[['plan','Meal plan'],['recipes','Recipes'],['pantry','Pantry'],['grocery','Grocery list']].map(([id,label])=>`<button onclick="nav('${id}')" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}>${svg(id)}${label}${id==='grocery'&&cart?`<span class="count">${cart}</span>`:''}</button>`).join('');document.getElementById('content').innerHTML=({recipes:recipeView,plan:planView,pantry:pantryView,grocery:groceryView})[view]();}
function heading(eyebrow,title,sub,right=''){return `<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div>${right}</div>`}
function recipeView(){const r=recipe(selected),miss=missing(r),isSaved=state.saved.includes(r.id);return heading('The recipe studio',"What’s good tonight?",'Start with your kitchen. We’ll help with the possibilities.',`<span class="pill orange">${state.inventory.filter(i=>i.soon&&i.qty>0).length} ingredients to use soon</span>`)+`<div class="tabs"><button class="${recipeTab==='cook'?'active':''}" onclick="recipeTab='cook';render()">Cook now</button><button class="${recipeTab==='saved'?'active':''}" onclick="recipeTab='saved';render()">Saved recipes (${state.saved.length})</button><button onclick="importConcept()">Import a recipe</button></div>`+(recipeTab==='saved'?savedView():`<form class="promptbox" onsubmit="event.preventDefault();suggest()"><div class="promptrow"><input id="prompt" aria-label="What would you like to cook?" value="Use my tomatoes, keep it easy." maxlength="240"><button class="btn" type="submit">Find my dinner <span aria-hidden="true">↗</span></button></div><div class="chips"><button type="button" class="chip ${goal==='use-soon'?'active':''}" aria-pressed="${goal==='use-soon'}" onclick="setGoal('use-soon')">Use soon first</button><button type="button" class="chip ${goal==='no-shopping'?'active':''}" aria-pressed="${goal==='no-shopping'}" onclick="setGoal('no-shopping')">No extra shopping</button><span class="pill">About 25 minutes</span><span class="pill">2 servings</span><span class="pill">Simple cleanup</span></div></form><div class="recipe-layout"><article class="card recipe-main"><div class="recipe-top"><span class="pill dark">${goal==='no-shopping'?'Pantry-only pick':'Recommended for your kitchen'}</span><h2>${esc(r.name)}</h2><div class="meta">${r.time} min &nbsp; / &nbsp; ${r.servings} servings &nbsp; / &nbsp; ${r.tool}</div><div class="recipe-number" aria-hidden="true">0${RECIPES.indexOf(r)+1}</div></div><div class="recipe-main-body"><div class="labelrow"><span class="eyebrow">Why this fits</span><span class="pill ${miss.length?'orange':'lime'}">${miss.length?`${r.ingredients.length-miss.length} of ${r.ingredients.length} on hand`:'All ingredients on hand'}</span></div>${whyFor(r).map(([a,b])=>`<div class="reason-line"><span class="dot"></span><div><strong>${a}</strong><p>${b}</p></div></div>`).join('')}<div class="divider"></div><div class="actions"><button class="btn" onclick="planModal('${r.id}')">Plan this meal</button><button class="btn secondary" onclick="cookModal('${r.id}')">Cook now</button><button class="btn secondary" onclick="saveRecipe('${r.id}')" aria-pressed="${isSaved}">${isSaved?'Saved ✓':'Save recipe'}</button></div></div></article><aside class="card recipe-aside"><div class="labelrow"><h3>Your kitchen check</h3><span class="small muted">2 servings</span></div><p class="small muted" style="margin:0 0 13px">A clear view of what’s here and what’s missing.</p>${r.ingredients.map(([id,n])=>{const i=item(id),yes=i.qty>=n;return `<div class="ingredient-row"><div><span class="tick">${yes?'✓':'+'}</span>${esc(i.name)}<span class="qty" style="display:block;margin-left:19px">${fmt(n,i.unit)} needed</span></div>${yes?`<span class="pill">On hand</span>`:`<span class="missing">Need ${fmt(Math.max(0,n-i.qty),i.unit)}</span>`}</div>`}).join('')}<div class="note" style="margin-top:17px">${miss.length?'Missing ingredients sync to your grocery list when you choose or plan this meal. Browsing stays clutter-free.':'Ready to make from recorded stock. Confirm what is actually on hand before cooking.'}</div><div class="actions" style="margin-top:14px"><button class="btn secondary small" onclick="showSteps('${r.id}')">View recipe</button>${miss.length?`<button class="btn link small" onclick="requestRecipe('${r.id}')">Add missing to list</button>`:''}</div></aside></div><div class="mini-recipes">${RECIPES.filter(x=>x.id!==r.id).map(x=>`<article class="card mini"><div class="index" aria-hidden="true">0${RECIPES.indexOf(x)+1}</div><div class="mini-body"><div class="eyebrow">${x.id==='r3'?'No-shopping fallback':'Another good option'}</div><h3>${x.name}</h3><span class="small muted">${x.time} min · ${x.tool} · ${missing(x).length?missing(x).length+' missing':'Ready to cook'}</span></div><button class="btn secondary small" onclick="selected='${x.id}';render()" aria-label="View ${x.name}">View ↗</button></article>`).join('')}</div><p class="footnote">Sample recipes and timings illustrate the experience; they are not kitchen-tested. This prototype uses three fixed recipes, not a live AI model.</p>`)}
function whyFor(r){const hasSoon=r.soon.map(item).filter(i=>i&&i.qty>0&&i.soon);const m=missing(r);return [[hasSoon.length?'Use-soon food has a place':'A practical pantry option',hasSoon.length?'Uses '+hasSoon.map(i=>i.name.toLowerCase()).join(' and ')+', marked by you for attention.':'A simple meal using the stock recorded in your kitchen.'],['Works with your kitchen',r.tool==='Oven + pot'?'An oven and a pot; a little more cleanup than the skillet option.':'One cooking vessel and a lid. No special equipment.'],[m.length===0?'No extra ingredients needed':m.length===1?'A small grocery gap':m.length+' ingredients need attention',m.length===0?'All required amounts are physically on hand; planned meals may already reserve some.':m.length+' ingredient'+(m.length===1?' is':'s are')+' below the required amount in your recorded stock.']]}
function savedView(){const rs=RECIPES.filter(r=>state.saved.includes(r.id));return rs.length?`<div class="mini-recipes">${rs.map(r=>`<article class="card mini"><div class="index">✓</div><div class="mini-body"><div class="eyebrow">Your collection</div><h3>${r.name}</h3><span class="small muted">${r.time} min · ${r.tool}</span></div><button class="btn secondary small" onclick="selected='${r.id}';recipeTab='cook';render()">Open</button></article>`).join('')}</div>`:`<div class="card empty-state"><h3>Keep the meals you love.</h3><p class="muted">Saved recipes will show up here.</p><button class="btn" onclick="recipeTab='cook';render()">Explore recipes</button></div>`}
function setGoal(g){goal=g;selected=g==='no-shopping'?'r3':'r1';render();toast(g==='no-shopping'?'Showing a sample meal with no missing ingredients.':'Showing the sample use-soon recommendation.');}
function suggest(){const p=(document.getElementById('prompt')?.value||'').toLowerCase();selected=goal==='no-shopping'?'r3':(/zucchini|pepper|garden/.test(p)?'r2':'r1');render();toast('Sample recommendation refreshed. Free-form AI generation is not connected.');}
function planView(){const active=state.plans.filter(p=>!p.cooked),rows=shopping(),d=demand(),soonUsed=state.inventory.filter(i=>i.soon&&d[i.id]).length;return heading('A little planning, a lot less guessing','Your week, made easier.','September 28 – October 4 · Dinner for two',`<button class="btn" onclick="weekModal()">Suggest my week ↗</button>`)+`<div class="banner"><span class="pill orange">Use soon first</span><div class="body"><strong>Give your tomatoes, zucchini and peppers a plan.</strong><p>Dates are household estimates. Check the food itself before using it.</p></div><button class="btn secondary small" onclick="nav('pantry');pantryTab='soon';render()">See pantry</button></div><div class="week-grid">${['Mon','Tue','Wed','Thu','Fri'].map((day,idx)=>{const p=state.plans.find(p=>p.day===day);return `<section><div class="day-head">${day}<span>${28+idx>30?28+idx-30:28+idx}</span></div>${p?`<article class="card day-card"><span class="pill ${p.cooked?'lime':'dark'}">${p.cooked?'Cooked ✓':'Dinner'}</span><h3>${recipe(p.recipeId).name}</h3><span class="small muted">${p.servings} servings<br>${recipe(p.recipeId).time} min · ${recipe(p.recipeId).tool}</span><div class="status">${p.cooked?'Stock has been updated.':missing(recipe(p.recipeId),p.servings).length?'Grocery list is synced.':'Ingredients on hand.'}</div>${p.cooked?'<span class="pill">Complete</span>':`<button class="btn small" onclick="cookModal('${p.recipeId}','${p.day}')">Cook & update</button><button class="remove" onclick="removePlan('${day}')">Remove from plan</button>`}</article>`:day==='Wed'?`<article class="card day-card anchor"><span class="pill">Personal plan</span><h3>Dinner out</h3><p class="muted">No ingredients reserved.<br>Not every night needs a recipe.</p><span class="eyebrow" style="margin-top:auto">A little breathing room</span></article>`:day==='Thu'?`<article class="card day-card anchor"><span class="pill">Flexible</span><h3>Leftovers or<br>keep it open</h3><p class="muted">A suggestion, not an assumed leftover meal.</p><button class="btn secondary small" onclick="planModal('r1','Thu')">Choose a meal</button></article>`:`<article class="card day-card empty"><span class="plus" aria-hidden="true">+</span><strong>Keep it easy</strong><span class="small">Pick a meal or leave room.</span><button class="btn secondary small" onclick="planModal('${day==='Tue'?'r2':day==='Fri'?'r3':'r1'}','${day}')">Add a meal</button></article>`}</section>`}).join('')}</div><div class="plan-bottom"><article class="card"><div class="eyebrow">This plan at a glance</div><div class="metricrow"><div class="metric"><strong>${active.length}</strong><span>meals still to cook</span></div><div class="metric"><strong>${soonUsed}</strong><span>use-soon ingredients planned</span></div><div class="metric"><strong>${rows.length}</strong><span>grocery items</span></div></div><p class="small muted" style="margin-top:20px;margin-bottom:0">Planning reserves ingredients. Your physical stock only changes after a confirmed action.</p></article><article class="card" style="background:var(--pale)"><div class="eyebrow">Saturday & Sunday</div><h3 style="margin-top:9px">Leave the weekend open.</h3><p class="small muted">A good plan can include leftovers, eating out, and absolutely no plan. This demo focuses on weekday dinners.</p><button class="btn link small" onclick="nav('grocery')">Review your grocery list →</button></article></div>${state.events.length?`<p class="activity">Latest update · ${esc(state.events[0])}</p>`:''}`}
function pantryView(){const d=demand(),all=state.inventory.filter(i=>i.qty>0),items=pantryTab==='soon'?all.filter(i=>i.soon):all;return heading('Know what’s here','A pantry that keeps up.','Useful inventory. No spreadsheet-level perfection required.',`<button class="btn" onclick="addItemModal()">+ Add food</button>`)+`<div class="stats"><div class="stat"><strong>${all.length}</strong><div class="small">ingredients<br><b>on hand</b></div></div><div class="stat" style="background:var(--peach)"><strong>${all.filter(i=>i.soon).length}</strong><div class="small">marked by you<br><b>use soon</b></div></div><div class="stat"><strong>${Object.keys(d).length}</strong><div class="small">ingredients<br><b>in the meal plan</b></div></div></div><div class="tabs"><button class="${pantryTab==='all'?'active':''}" onclick="pantryTab='all';render()">All food</button><button class="${pantryTab==='soon'?'active':''}" onclick="pantryTab='soon';render()">Use soon</button><button onclick="leftoversModal()">Leftovers (${state.leftovers.reduce((a,l)=>a+l.portions,0)} portions)</button></div><div class="card table-card"><div class="table-scroll"><table><thead><tr><th>INGREDIENT / SOURCE</th><th>ON HAND</th><th>PLANNED</th><th>STORAGE</th><th>FRESHNESS</th><th><span class="tiny">UPDATE</span></th></tr></thead><tbody>${items.map(i=>`<tr><td><strong>${esc(i.name)}</strong><span class="sub">${esc(i.source)}</span></td><td>${fmt(i.qty,i.unit)}</td><td>${d[i.id]?fmt(d[i.id].qty,i.unit):'—'}</td><td>${esc(i.location)}</td><td>${i.soon?'<span class="pill orange">Use soon · estimated</span>':'<span class="muted tiny">No reminder set</span>'}</td><td><button class="table-button" onclick="editItemModal('${i.id}')" aria-label="Update ${esc(i.name)}">Edit</button></td></tr>`).join('')}</tbody></table></div></div><div class="banner" style="margin-top:20px;margin-bottom:0"><div class="body"><strong>Garden harvest? Farm-share box? Add just the useful details.</strong><p>Record an amount, where it lives, and whether you want to use it soon. Recipes can use it right away.</p></div><button class="btn secondary small" onclick="addItemModal('Garden')">Add a harvest</button></div><p class="footnote">“Use soon” is a user-set planning reminder, not a food-safety assessment. This demo stores confirmed quantities; confidence levels and batch dates are described in the portfolio.</p>`}
function groceryView(){const rows=shopping(),picked=Object.keys(state.picked).length;return heading('Just what you need','A smarter grocery list.','Missing ingredients, brought together. Nothing ordered without you.',`<button class="btn secondary" onclick="manualModal()">+ Add an item</button>`)+`<div class="shopping-layout"><article class="card"><div class="list-head"><h3>${rows.length?'Your list':'You’re all set.'}</h3><span class="pill">${rows.length} items</span></div>${rows.length?rows.map(i=>`<div class="shopping-row ${i.picked?'checked':''}"><input type="checkbox" id="shop-${i.id}" ${i.picked?'checked':''} onchange="togglePicked('${i.id}')" aria-label="Mark ${esc(i.name)} as picked up"><label for="shop-${i.id}">${esc(i.name)}<span>${i.reasons.map(esc).join('<br>')}</span></label><span class="amount">${fmt(i.need,i.unit)}</span></div>`).join(''):`<div class="empty-state"><p class="muted">Choose a meal to see only the ingredients you’re missing.</p><button class="btn" onclick="nav('recipes')">Find a meal</button></div>`}<p class="small muted" style="margin-top:22px">Quantities are merged across your plan and reduced by stock on hand. This demo does not compare prices or connect to a retailer.</p></article><aside><article class="card checkoutbox"><div class="eyebrow" style="color:var(--ink);margin-bottom:15px">Close the loop</div><h3>Bought is good.<br>Put away is better.</h3><p class="small">Check items as you shop. When you’re home, confirm the actual amounts you brought back.</p><div class="divider" style="background:#bfcf9b"></div><p class="small"><b>${picked} ${picked===1?'item':'items'} picked up</b><br>Pantry has not changed yet.</p><button class="btn" style="width:100%;margin-top:6px" ${picked?'':'disabled'} onclick="receiveModal()">Put groceries away →</button></article><article class="card" style="margin-top:17px;padding:21px"><div class="eyebrow">Why it’s on the list</div><p class="small muted">Every item keeps a connection to its meal or your manual request. Change the plan and the list updates with it.</p><button class="btn link small" onclick="nav('plan')">Back to the meal plan →</button></article></aside></div><p class="footnote">Checked items remain pending until put-away confirmation. No retailer accounts, prices, orders, or payments are connected.</p>`}
function openModal(title,content){lastFocus=document.activeElement;document.getElementById('modal').innerHTML=`<div class="modal-top"><div class="eyebrow">LunchBox / Confirm the details</div><button class="close" onclick="closeModal()" aria-label="Close dialog">×</button></div><h2 id="modalTitle">${title}</h2>${content}`;document.getElementById('overlay').hidden=false;document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('#modal input,#modal select,#modal .close')?.focus(),0)}
function closeModal(){document.getElementById('overlay').hidden=true;document.body.style.overflow='';lastFocus?.focus()}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.addEventListener('keydown',e=>{if(document.getElementById('overlay').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...document.querySelectorAll('#modal button:not(:disabled),#modal input,#modal select,#modal a')],first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function toast(msg,canUndo=false){clearTimeout(toastTimer);const t=document.getElementById('toast');t.innerHTML=`<span>${esc(msg)}</span>${canUndo?'<button onclick="undo()">Undo</button>':''}`;t.hidden=false;toastTimer=setTimeout(()=>t.hidden=true,canUndo?14000:5500)}
function planModal(rid,day='Mon'){const r=recipe(rid);openModal('Make room for a good meal.',`<p><b>${r.name}</b> · Ingredients are reserved, not removed. Missing quantities will sync to the grocery list.</p><form onsubmit="event.preventDefault();confirmPlan('${rid}')"><div class="field-grid"><label class="field">Day<select id="planDay">${['Mon','Tue','Thu','Fri'].map(d=>`<option ${d===day?'selected':''}>${d}</option>`).join('')}</select></label><label class="field">Servings<input id="planServings" type="number" value="2" min="1" max="12" step="1" required></label></div><div class="note">An existing meal on the selected day will be replaced. The list will be recalculated; physical pantry quantities stay unchanged.</div><div class="actions"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Plan meal + sync list</button></div></form>`)}
function confirmPlan(rid){const day=document.getElementById('planDay').value,n=Number(document.getElementById('planServings').value);if(!Number.isInteger(n)||n<1||n>12)return;closeModal();view='plan';change('Meal planned. Pantry reserved; grocery list synced.',()=>{state.plans=state.plans.filter(p=>p.day!==day);state.plans.push({day,recipeId:rid,servings:n,cooked:false});state.requests=state.requests.filter(id=>id!==rid)})}
function weekModal(){openModal('A useful week, not a full one.',`<p>This sample proposal fills three open nights and keeps your personal plans intact.</p><div class="step"><b>Mon</b>Tomato & lentil skillet</div><div class="step"><b>Tue</b>Garden rice bowls</div><div class="step"><b>Fri</b>Pantry lentil rice</div><p>Wednesday stays “Dinner out.” Thursday stays flexible. Existing planned meals are not replaced. Review before accepting; no ingredients are deducted.</p><div class="actions"><button class="btn secondary" onclick="closeModal()">Not now</button><button class="btn" onclick="confirmWeek()">Accept open-night suggestions</button></div>`)}
function confirmWeek(){closeModal();change('Open nights planned. Existing meals kept; list recalculated.',()=>{[['Mon','r1'],['Tue','r2'],['Fri','r3']].forEach(([day,rid])=>{if(!state.plans.some(p=>p.day===day))state.plans.push({day,recipeId:rid,servings:2,cooked:false})});state.requests=state.requests.filter(rid=>!state.plans.some(p=>p.recipeId===rid&&!p.cooked))})}
function removePlan(day){change(`${day} meal removed. Reservations and grocery needs updated.`,()=>state.plans=state.plans.filter(p=>p.day!==day))}
function saveRecipe(rid){change(state.saved.includes(rid)?'Recipe removed from saved collection.':'Recipe saved to your collection.',()=>{state.saved=state.saved.includes(rid)?state.saved.filter(id=>id!==rid):[...state.saved,rid]})}
function requestRecipe(rid){view='grocery';change('Missing ingredients added. Existing requests were not duplicated.',()=>{if(!state.requests.includes(rid))state.requests.push(rid)})}
function togglePicked(id){const row=shopping().find(i=>i.id===id);change(state.picked[id]?'Item unchecked. Pantry unchanged.':'Marked as picked up. Confirm put-away to update pantry.',()=>{if(state.picked[id])delete state.picked[id];else state.picked[id]={qty:row.need}})}
function receiveModal(){const ids=Object.keys(state.picked);openModal('What came home?',`<p>Confirm actual quantities—not just what the recipe needed. For example, you might buy a 200 g bag when a recipe needs 100 g.</p><form onsubmit="event.preventDefault();confirmReceive()">${ids.map(id=>`<label class="field">${esc(item(id).name)} (${item(id).unit})<input type="number" min="0.1" step="0.1" required id="receive-${id}" value="${state.picked[id].qty}"></label>`).join('')}<div class="note">This adds to physical stock and recalculates the grocery list. Adjusted quantities are recorded; no purchase or payment is made.</div><div class="actions"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Confirm & update pantry</button></div></form>`)}
function confirmReceive(){const values=Object.keys(state.picked).map(id=>[id,Number(document.getElementById(`receive-${id}`).value)]);if(values.some(([,n])=>!Number.isFinite(n)||n<=0))return;closeModal();change('Groceries put away. Actual stock and shopping needs updated.',()=>{values.forEach(([id,n])=>{const recipeNeed=Math.max(0,(demand()[id]?.qty||0)-item(id).qty);item(id).qty+=n;state.manual=state.manual.map(m=>m.id===id?{...m,qty:Math.max(0,m.qty-Math.max(0,n-recipeNeed))}:m).filter(m=>m.qty>0);delete state.picked[id]})})}
function cookModal(rid,day=''){const r=recipe(rid),p=day?state.plans.find(p=>p.day===day):state.plans.find(p=>p.recipeId===rid&&!p.cooked),n=p?p.servings:2;const lacks=missing(r,n);if(lacks.length){openModal('A quick kitchen check first.',`<p>You don’t have enough recorded stock for ${n} servings of <b>${r.name}</b>.</p>${lacks.map(([id,q])=>`<div class="ingredient-row"><b>${item(id).name}</b><span>Need ${fmt(Math.max(0,q*n/2-item(id).qty),item(id).unit)} more</span></div>`).join('')}<p>Have it already? Update the pantry. Picked it up? Confirm that it was put away. The demo will not silently allow negative stock.</p><div class="actions"><button class="btn secondary" onclick="closeModal();nav('pantry')">Update pantry</button><button class="btn" onclick="closeModal();requestRecipe('${rid}')">Go to grocery list</button></div>`);return}openModal('Cooked it? Close the loop.',`<p><b>${r.name}</b> · Review what you actually used. Nothing changes until you confirm.</p><form onsubmit="event.preventDefault();confirmCook('${rid}','${p?p.day:''}',${n})">${r.ingredients.map(([id,q])=>`<div class="ingredient-row"><label for="used-${id}">${item(id).name} <span class="qty">(${item(id).unit})</span></label><input class="inline-input" id="used-${id}" type="number" min="0" max="${item(id).qty}" step="0.1" value="${q*n/2}" required aria-label="${item(id).name} used"></div>`).join('')}<div class="field-grid" style="margin-top:15px"><label class="field">Portions made<input id="portionsMade" type="number" min="1" max="20" value="${n}" step="1" required></label><label class="field">Eaten now<input id="portionsEaten" type="number" min="0" max="20" value="${n}" step="1" required></label></div><div class="note">Ingredients leave stock now. Uneaten portions become leftovers, which can be marked eaten later without deducting ingredients twice.</div><p id="cookError" role="alert" style="color:var(--orange)"></p><div class="actions"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Confirm cooked & update</button></div></form>`)}
function confirmCook(rid,day,n){const r=recipe(rid),vals=r.ingredients.map(([id])=>[id,Number(document.getElementById(`used-${id}`).value)]),made=Number(document.getElementById('portionsMade').value),eaten=Number(document.getElementById('portionsEaten').value);if(eaten>made){document.getElementById('cookError').textContent='Eaten portions cannot exceed the portions made.';return}if(vals.some(([id,q])=>!Number.isFinite(q)||q<0||q>item(id).qty)||!Number.isInteger(made)||!Number.isInteger(eaten)||made<1||eaten<0)return;closeModal();change('Meal cooked. Ingredients updated; uneaten portions saved as leftovers.',()=>{vals.forEach(([id,q])=>item(id).qty=Math.max(0,item(id).qty-q));const p=state.plans.find(p=>p.day===day&&p.recipeId===rid&&!p.cooked);if(p)p.cooked=true;state.requests=state.requests.filter(id=>id!==rid);if(made>eaten)state.leftovers.push({id:Date.now(),name:r.name,portions:made-eaten})})}
function leftoversModal(){openModal('Good food for later.',state.leftovers.length?`${state.leftovers.map(l=>`<div class="ingredient-row"><div><b>${l.name}</b><div class="small muted">${l.portions} ${l.portions===1?'portion':'portions'}</div></div><button class="btn secondary small" onclick="eatLeftover(${l.id})">Eat 1 portion</button></div>`).join('')}<p>Ingredients were already removed when this food was cooked. Eating a leftover only changes the prepared-food count. Storage and date tracking are future features.</p>`:'<p>No leftovers recorded yet. When confirming a cooked meal, set “Eaten now” below “Portions made” to save the rest.</p>')}
function eatLeftover(id){closeModal();change('One leftover portion eaten. Raw ingredient stock is unchanged.',()=>{state.leftovers.find(l=>l.id===id).portions--;state.leftovers=state.leftovers.filter(l=>l.portions>0)})}
function addItemModal(source='Manual'){openModal('A little more in your kitchen.',`<form onsubmit="event.preventDefault();confirmAdd()"><label class="field">Ingredient name<input id="addName" placeholder="e.g. Zucchini" required maxlength="60"></label><div class="field-grid"><label class="field">Amount<input id="addQty" type="number" min="0.1" step="0.1" value="2" required></label><label class="field">Unit<select id="addUnit"><option>each</option><option>g</option><option>ml</option></select></label></div><div class="field-grid"><label class="field">Source<select id="addSource">${['Manual','Garden','Farm share','Grocery'].map(s=>`<option ${s===source?'selected':''}>${s}</option>`).join('')}</select></label><label class="field">Storage<select id="addLocation"><option>Fridge</option><option>Freezer</option><option>Cupboard</option></select></label></div><label class="small"><input type="checkbox" id="addSoon"> Remind me to use this soon</label><div class="actions"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Add to pantry</button></div></form>`)}
function confirmAdd(){const name=document.getElementById('addName').value.trim(),qty=Number(document.getElementById('addQty').value),unit=document.getElementById('addUnit').value,source=document.getElementById('addSource').value,location=document.getElementById('addLocation').value,soon=document.getElementById('addSoon').checked;if(!name||!Number.isFinite(qty)||qty<=0)return;closeModal();change('Food added. Your pantry and meal needs are up to date.',()=>{const exists=state.inventory.find(i=>i.name.toLowerCase()===name.toLowerCase()&&i.unit===unit);if(exists){exists.qty+=qty;exists.soon=soon;exists.source=source;exists.location=location}else state.inventory.push({id:'custom'+Date.now(),name,qty,unit,source,location,soon})})}
function editItemModal(id){const i=item(id);openModal('Keep your pantry honest.',`<p>${esc(i.name)} · ${esc(i.location)}</p><form onsubmit="event.preventDefault();confirmEdit('${id}')"><label class="field">Actual amount on hand (${i.unit})<input id="editQty" type="number" min="0" step="0.1" value="${i.qty}" required></label><label class="small"><input type="checkbox" id="editSoon" ${i.soon?'checked':''}> Remind me to use this soon</label><label class="field">Reason<select id="editReason"><option>Quick correction</option><option>Used outside a recipe</option><option>Discarded / spoiled</option></select></label><div class="note">Replaces the recorded amount with what you counted. Any affected shopping needs update automatically.</div><div class="actions"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Update amount</button></div></form>`)}
function confirmEdit(id){const qty=Number(document.getElementById('editQty').value),soon=document.getElementById('editSoon').checked,reason=document.getElementById('editReason').value;if(!Number.isFinite(qty)||qty<0)return;closeModal();change(`Pantry updated: ${reason.toLowerCase()}.`,()=>{item(id).qty=qty;item(id).soon=soon})}
function manualModal(){openModal('Something else for the list?',`<p>Add an extra quantity to buy, in addition to any recipe shortfall.</p><form onsubmit="event.preventDefault();confirmManual()"><label class="field">Ingredient<select id="manualId">${state.inventory.map(i=>`<option value="${i.id}">${esc(i.name)} (${i.unit})</option>`).join('')}</select></label><label class="field">Extra amount to buy<input id="manualQty" type="number" min="0.1" step="0.1" value="1" required></label><div class="actions"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Add to list</button></div></form>`)}
function confirmManual(){const id=document.getElementById('manualId').value,qty=Number(document.getElementById('manualQty').value);if(!Number.isFinite(qty)||qty<=0)return;closeModal();change('Extra item added to your grocery list.',()=>{const m=state.manual.find(m=>m.id===id);if(m)m.qty+=qty;else state.manual.push({id,qty})})}
function showSteps(rid){const r=recipe(rid);openModal(r.name,`<p>${r.time} min · ${r.servings} servings · ${r.tool}</p><div class="note">Concept content only. These sample recipes and timings are not kitchen-tested. No nutrition or food-safety claims are generated.</div>${r.steps.map((s,i)=>`<div class="step"><b>0${i+1}</b><span>${s}</span></div>`).join('')}<div class="actions"><button class="btn secondary" onclick="closeModal()">Close</button><button class="btn" onclick="closeModal();planModal('${rid}')">Plan this meal</button></div>`)}
function importConcept(){openModal('Your recipes belong here, too.',`<p><b>Proposed feature · Not connected in this prototype.</b></p><div class="step"><b>01</b><span>Paste text, add a recipe link, or upload a photo.</span></div><div class="step"><b>02</b><span>Review parsed ingredients, amounts, servings, and cooking steps.</span></div><div class="step"><b>03</b><span>Save the original and your adapted version. Plan from the same pantry-aware recipe system.</span></div><p>No file upload is collected in this demo. Importing and AI parsing need a production backend.</p><div class="actions"><button class="btn" onclick="closeModal()">Back to recipes</button></div>`)}
function about(){openModal('A concept you can try.',`<p>LunchBox connects recipes, pantry inventory, and grocery needs through one meal plan.</p><div class="note"><b>Interactive:</b> plan sample meals, save recipes, update inventory, add garden food, check off shopping, confirm actual purchases, cook meals, track leftovers, and undo changes.</div><p><b>Simulated or not built:</b> AI generation, nutrition calculation, recipe import, multi-user sync, freshness prediction, price comparison, online ordering, and external integrations.</p><p>Three fixed recipes and one sample week are provided. Changes are saved only in this browser when browser storage is available. No analytics or network requests are made.</p><div class="actions"><button class="btn secondary" onclick="closeModal();resetDemo()">Reset sample data</button><button class="btn" onclick="closeModal()">Explore the concept</button></div>`)}
function resetDemo(){lastUndo=null;state=structuredClone(INITIAL);view='recipes';selected='r1';recipeTab='cook';pantryTab='all';goal='use-soon';persist();render();toast('Sample household reset. No real inventory was changed.');}
render();
</script></body></html>
